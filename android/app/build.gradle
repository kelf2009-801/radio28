plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ru.syzran.radio28"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ru.syzran.radio28"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def lp = rootProject.file('local.properties')
            if (lp.exists()) {
                def props = new Properties()
                lp.withInputStream { props.load(it) }
                if (props.getProperty('storeFile')) {
                    storeFile file(props.getProperty('storeFile'))
                    storePassword props.getProperty('storePassword')
                    keyAlias props.getProperty('keyAlias')
                    keyPassword props.getProperty('keyPassword')
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release.storeFile != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

flutter {
    source = "../.."
}
