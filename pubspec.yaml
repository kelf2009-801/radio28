name: radio28
description: Online PTT radio for bus drivers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  livekit_client: 2.2.4
  http: ^1.2.0
  web_socket_channel: ^2.4.5
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  pointycastle: ^3.9.0
  uuid: ^4.4.0
  vibration: ^1.8.4
  permission_handler: ^11.3.0
  wakelock_plus: ^1.2.0
  flutter_local_notifications: ^17.2.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  package_info_plus: 4.2.0
  wakelock_plus: 1.1.4

flutter:
  uses-material-design: true
