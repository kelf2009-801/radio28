services:
  livekit:
    image: livekit/livekit-server:v1.10
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host          # WebRTC needs the full UDP media range + real public IP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

  api:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/radio28.db
      LK_API_KEY: ${LK_API_KEY}
      LK_API_SECRET: ${LK_API_SECRET}
      LK_PUBLIC_URL: ${LK_PUBLIC_URL}
      SEED_CHANNEL_NAME: "Сызрань-28"
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - livekit
    networks:
      - radio

volumes:
  api-data:

networks:
  radio:
    driver: bridge
