version: "3.8"

services:
  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"          # WS API
      - "7881:7881"          # RTC TCP (optional fallback)
      - "7882:7882/udp"      # RTC UDP (mux)
      - "50000-60000:50000-60000/udp"  # RTC UDP range
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - radio

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command: ["-c", "/etc/turnserver.conf"]
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    networks:
      - radio

  api:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/radio28.db
      LK_API_KEY: ${LK_API_KEY}
      LK_API_SECRET: ${LK_API_SECRET}
      LK_PUBLIC_URL: ${LK_PUBLIC_URL}
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - livekit
    networks:
      - radio

volumes:
  api-data:

networks:
  radio:
    driver: bridge
