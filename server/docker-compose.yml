services:
  livekit:
    image: livekit/livekit-server:v1.10
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"          # WS API
      - "7881:7881"          # RTC TCP
      - "7882:7882/udp"      # RTC UDP (mux)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - radio

  api:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/radio28.db
      LK_API_KEY: ${LK_API_KEY}
      LK_API_SECRET: ${LK_API_SECRET}
      LK_PUBLIC_URL: ${LK_PUBLIC_URL}
      SEED_CHANNEL_NAME: "Сызрань-28"
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - livekit
    networks:
      - radio

volumes:
  api-data:

networks:
  radio:
    driver: bridge
